# Example nginx vhost for SignalOps Status. Adjust server_name, root, TLS and the PHP-FPM socket.
# The document root is the repository's public/ directory.
#
# Routing:
#   /assets/...          static files (long-lived cache; URLs carry ?v=<mtime>)
#   /index.php           classic single-page dashboard (also /?classic=1)
#   /, /overview, ...    no such file -> /index.php -> src/front.php (router, 404 page)
#
# Test with `nginx -t`, then reload.

server {
    listen 80;
    listen [::]:80;
    server_name status.example.com;

    root /var/www/signalops-status/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Front controller: real files first, everything else goes to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Site assets: the layout links them as /assets/site/<entry>/<entry>.css?v=<filemtime>, so a
    # changed file always gets a new URL and browsers/CDNs may keep it for a year.
    location ^~ /assets/site/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Classic dashboard assets (versioned with ?v= in app/views/dashboard.php).
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Only public/index.php is an entry point.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
